name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  PROJECT: DesktopIconToggle.csproj

jobs:
  build:
    name: Build and package (smoke test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore
        shell: pwsh
        run: dotnet restore "$env:PROJECT"

      - name: Build
        shell: pwsh
        run: dotnet build "$env:PROJECT" -c Release --no-restore

      - name: Publish STANDARD (framework-dependent, single file)
        shell: pwsh
        run: >
          dotnet publish "$env:PROJECT"
          -c Release
          -r win-x64
          --self-contained false
          -p:PublishSingleFile=true
          -o "smoke/standard"

      - name: Publish PORTABLE (self-contained, single file)
        shell: pwsh
        run: >
          dotnet publish "$env:PROJECT"
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:PublishTrimmed=false
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o "smoke/portable"

      - name: Verify published executables
        shell: pwsh
        run: |
          $expected = @(
            'smoke/standard/DesktopIconToggle.exe',
            'smoke/portable/DesktopIconToggle.exe'
          )
          foreach ($exe in $expected) {
            if (-not (Test-Path $exe)) { throw "Missing expected output: $exe" }
            $size = [math]::Round((Get-Item $exe).Length / 1MB, 2)
            Write-Host "OK  $exe  ($size MB)"
          }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $dir = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6'
          if (-not (Test-Path (Join-Path $dir 'ISCC.exe'))) {
            throw "ISCC.exe not found in '$dir'"
          }
          Add-Content -Path $env:GITHUB_PATH -Value $dir

      - name: Compile installer script
        shell: pwsh
        run: |
          # The installer expects the self-contained build under its published name.
          New-Item -ItemType Directory -Force -Path 'installer/src' | Out-Null
          Copy-Item -Force 'smoke/portable/DesktopIconToggle.exe' `
            'installer/src/DesktopIconToggle-win_x64-Portable.exe'
          $out = Join-Path $PWD 'artifacts'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          & iscc.exe 'installer/installer.iss' `
            "/DMyAppVersion=0.0.0.${{ github.run_number }}" `
            "/DMyAppSourceDir=$(Resolve-Path 'installer/src')" `
            "/O$out"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path (Join-Path $out 'DesktopIconToggle-Setup.exe'))) {
            throw 'DesktopIconToggle-Setup.exe was not produced'
          }

      - uses: actions/upload-artifact@v4
        with:
          name: DesktopIconToggle-Setup-CI
          path: artifacts/DesktopIconToggle-Setup.exe
          if-no-files-found: error
